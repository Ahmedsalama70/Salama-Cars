
<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Cars</title>
        <script
            src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
        <link rel="stylesheet" href="css/style.css" />
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    </head>
    <body class="bg-gray-50 text-gray-800">

        <!-- Navbar -->
        <nav
            class="flex flex-wrap items-center justify-between gap-3 px-4 py-3 bg-gray-300 shadow-sm sm:px-6">
            <a class="flex items-center" href="#">
                <img src="./images/logo.jpg" alt="Logo" class="h-12 w-16 object-contain scale-125 sm:h-15 sm:w-20">
            </a>
            <div class="ml-auto flex flex-wrap items-center justify-end gap-2">
                <button
                    class="px-3 py-2 text-sm font-medium text-blue-600 border border-blue-600 rounded hover:bg-blue-600 hover:text-white transition sm:px-4"
                    onclick="redirectTo('login.html')">Login</button>
                <button
                    class="px-3 py-2 text-sm font-medium text-green-600 border border-green-600 rounded hover:bg-green-600 hover:text-white transition sm:px-4"
                    onclick="redirectTo('register.html')">Register</button>
            </div>
        </nav>

        <!-- Search -->
        <div class="max-w-7xl mx-auto mt-6 px-4">
            <div class="flex flex-wrap -mx-2 items-center">
                <div class="w-full md:w-3/12 px-2 mb-3 md:mb-0">
                    <select id="searchType"
                        class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 bg-white">
                        <option value="name">Search by Product Name</option>
                        <option value="category">Search by Category</option>
                    </select>
                </div>
                <div class="w-full md:w-7/12 px-2 mb-3 md:mb-0">
                    <input type="text" id="searchBox"
                        class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
                        placeholder="Search..." onkeyup="searchProducts()">
                </div>
                <div class="w-full md:w-2/12 px-2">
                    <button
                        class="search-btn w-full py-2 bg-gray-900 text-light text-white rounded hover:bg-gray-800 transition font-medium"
                        onclick="searchProducts()">Search</button>
                </div>
            </div>
        </div>

        <!-- Products -->
        <div class="max-w-7xl mx-auto mt-12 px-4" id="products-container">
            <div class="flex flex-wrap -mx-2" id="products-row">

            </div>
        </div>

        <!-- Footer -->
        <footer class="mt-12 bg-gray-900 text-gray-300">
            <div class="max-w-7xl mx-auto px-4 py-6 text-center">
                <p class="text-sm">&copy; 2026 Salama Cars &amp; Motorcycles Store. All rights reserved.</p>
            </div>
        </footer>

        <script src="js/script.js"></script>
    </body>
</html>
