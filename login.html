
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800">
    <!-- Navbar -->
    <nav class="flex items-center justify-between px-4 py-3 bg-gray-300 shadow-sm sm:px-6">
        <a class="flex items-center" href="index.html">
            <img src="./images/logo.jpg" alt="Logo" class="h-12 w-16 object-contain scale-125 sm:h-15 sm:w-20">
        </a>
    </nav>

    <!-- Login Form -->
    <div class="max-w-md mx-auto mt-12 px-4">
        <div class="login-container bg-white p-8 border border-gray-200 rounded-lg shadow-sm mt-5">
            <form id="loginForm">
                <div class="mb-4">
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" id="email" placeholder="Enter email" required>
                </div>
                <div class="mb-4">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" id="password" placeholder="Enter password" required>
                </div>
                <div class="flex items-center mb-4">
                    <input type="checkbox" class="h-4 w-4 text-blue-600 focus:ring-blue-500 border-gray-300 rounded" id="rememberMe">
                    <label class="ml-2 block text-sm text-gray-900" for="rememberMe">Remember Me</label>
                </div>
                <button type="button" class="w-full py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition font-medium" onclick="login()">Login</button>
                <p class="mt-4 text-sm text-center">Don't have an account? <a href="register.html" class="text-blue-600 hover:underline">Register</a></p>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-12 bg-gray-900 text-gray-300">
        <div class="max-w-7xl mx-auto px-4 py-6 text-center">
            <p class="text-sm">&copy; 2026 Salama Cars &amp; Motorcycles Store. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
