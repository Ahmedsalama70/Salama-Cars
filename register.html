<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Navbar -->
    <nav class="flex items-center justify-between px-4 py-3 bg-gray-300 shadow-sm sm:px-6">
        <a class="flex items-center" href="index.html">
            <img src="./images/logo.jpg" alt="Logo" class="h-12 w-16 object-contain scale-125 sm:h-15 sm:w-20">
        </a>
    </nav>

    <!-- Register Form -->
    <div class="max-w-xl mx-auto mt-12 px-4">
        <div class="register-container bg-white p-8 border border-gray-200 rounded-lg shadow-sm mt-5">
            <form id="registerForm">
                <div class="flex flex-wrap -mx-2 mb-4">
                    <div class="w-full md:w-1/2 px-2 mb-4 md:mb-0">
                        <label for="firstName" class="block text-sm font-medium text-gray-700 mb-1">First Name</label>
                        <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" id="firstName" placeholder="Enter first name">
                    </div>
                    <div class="w-full md:w-1/2 px-2">
                        <label for="lastName" class="block text-sm font-medium text-gray-700 mb-1">Last Name</label>
                        <input type="text" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" id="lastName" placeholder="Enter last name">
                    </div>
                </div>
                <div class="mb-4">
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                    <input type="email" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" id="email" placeholder="Enter email">
                </div>
                <div class="mb-6">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
                    <input type="password" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500" id="password" placeholder="Enter password">
                </div>
                <button type="button" class="w-full py-2 bg-blue-600 text-white rounded hover:bg-blue-700 transition font-medium" onclick="register()">Register</button>
                <p class="mt-4 text-sm text-center">Have an account? <a href="login.html" class="text-blue-600 hover:underline">Login</a></p>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-12 bg-gray-900 text-gray-300">
        <div class="max-w-7xl mx-auto px-4 py-6 text-center">
            <p class="text-sm">&copy; 2026 Salama Cars &amp; Motorcycles Store. All rights reserved.</p>
        </div>
    </footer>

    <script src="js/script.js"></script>
</body>
</html>
